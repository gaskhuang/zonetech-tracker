name: Daily Tracker

on:
  schedule:
    - cron: '0 19 * * *'   # 19:00 UTC = 03:00 Asia/Taipei
  workflow_dispatch:        # 手動觸發

permissions:
  contents: write

concurrency:
  group: daily-tracker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Write Service Account key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::Missing secret GCP_SA_KEY"; exit 1
          fi
          printf '%s' "$GCP_SA_KEY" > /tmp/sa.json
          python -c "import json,sys; json.load(open('/tmp/sa.json'))" || { echo "::error::GCP_SA_KEY is not valid JSON"; exit 1; }

      - name: Build report
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL:    ${{ secrets.GSC_SITE_URL }}
          SITE_URL:        ${{ secrets.SITE_URL }}
          WP_LOG_ENDPOINT: ${{ secrets.WP_LOG_ENDPOINT }}
          WP_LOG_TOKEN:    ${{ secrets.WP_LOG_TOKEN }}
        run: python scripts/render_report.py

      - name: Commit & push if changed
        run: |
          git config user.name  "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "report $(date -u +%Y-%m-%d)"
          git push
